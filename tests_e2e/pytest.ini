[pytest]
; This directory is deliberately separate from tests/ (see conftest.py's
; module docstring) - not asyncio, not covered by requirements_test.txt's HA mock.
;
; pytest-homeassistant-custom-component registers globally (pytest11 entry
; point) and blocks real sockets by default via pytest-socket - fine for
; tests/, fatal here since this suite boots a real hass process and drives
; it with a real browser over real localhost sockets.
addopts = -p no:homeassistant -p no:socket
